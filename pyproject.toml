[project]
name = "habits-app"
version = "0.1.0"
description = "Django/DRF app for habits tracking"
authors = [
    {name = "sergrih1980-sys", email = "sergrih1980@gmail.com"}
]
requires-python = "^3.13"
dependencies = [
    "django (>=6.0,<7.0)",
    "djangorestframework (>=3.14,<4.0)",
    "django-cors-headers (>=4.3,<5.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
